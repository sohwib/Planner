<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Planner</title>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f7f7f5;
  --bg3: #efefec;
  --border: rgba(0,0,0,0.09);
  --border2: rgba(0,0,0,0.18);
  --text: #1a1a1a;
  --text2: #6b6b6b;
  --text3: #b0b0b0;
  --accent: #1a1a1a;
  --accent-light: #f0f0f0;
  --green-bg:#eaf3de;--green-text:#3b6d11;
  --blue-bg:#e6f1fb;--blue-text:#185fa5;
  --gray-bg:#f1efe8;--gray-text:#5f5e5a;
  --done-bg:#e8f5e9;--done-text:#2e7d32;
  --radius:10px;--radius-sm:6px;
  --font: 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg2);color:var(--text);font-size:14px;min-height:100vh;}
.app{max-width:740px;margin:0 auto;padding:24px 16px 80px;}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.app-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.01em;}

/* Cards */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.07em;color:var(--text3);text-transform:uppercase;margin-bottom:12px;}

/* Tables */
.base-table{width:100%;border-collapse:collapse;}
.base-table th{font-size:11px;color:var(--text3);font-weight:500;text-align:left;padding:0 8px 8px 0;border-bottom:0.5px solid var(--border);}
.base-table td{padding:9px 8px 9px 0;border-bottom:0.5px solid var(--border);vertical-align:middle;font-size:13px;}
.base-table tr:last-child td{border-bottom:none;}

.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500;}
.b-active{background:var(--green-bg);color:var(--green-text);}
.b-start{background:var(--blue-bg);color:var(--blue-text);}
.b-wait{background:var(--gray-bg);color:var(--gray-text);}
.b-done{background:var(--done-bg);color:var(--done-text);}

.inline-input{background:transparent;border:none;outline:none;font-family:var(--font);font-size:13px;color:var(--text);width:100%;}
.inline-input::placeholder{color:var(--text3);}

/* Tabs */
.tab-section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.tab-bar{display:flex;border-bottom:0.5px solid var(--border);background:var(--bg2);}
.tab-btn{padding:11px 20px;font-size:13px;font-weight:500;color:var(--text2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-0.5px;transition:color 0.12s;}
.tab-btn.active{color:var(--text);border-bottom:2px solid var(--accent);background:var(--bg);}
.tab-btn:hover:not(.active){color:var(--text);}
.tab-pane{display:none;padding:18px;}
.tab-pane.active{display:block;}

/* Checklist */
.cl-toggle{background:transparent;border:0.5px solid var(--border);border-radius:var(--radius-sm);width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:middle;font-size:15px;color:var(--text2);transition:background 0.12s;padding:0;justify-content:center;}
.cl-toggle:hover{background:var(--bg2);}
.cl-panel{display:none;background:var(--bg2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:4px;flex-direction:column;gap:8px;}
.cl-panel.open{display:flex;}
.cl-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);}
.cl-row input[type="checkbox"]{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
.cl-done{text-decoration:line-through;color:var(--text3);}

/* Weekly */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.week-range{font-size:14px;font-weight:600;color:var(--text);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border2);}
.week-range:hover{opacity:0.7;}
.event-tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500;color:#fff;}
.mini-cal-overlay{display:none;position:fixed;inset:0;z-index:200;}
.mini-cal-overlay.open{display:block;}
.mini-cal-popup{position:fixed;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:14px;width:240px;box-shadow:0 8px 24px rgba(0,0,0,0.14);z-index:201;}
.mini-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mini-cal-label{font-size:13px;font-weight:600;color:var(--text);}
.mini-nav-btn{background:transparent;border:0.5px solid var(--border);border-radius:var(--radius-sm);width:24px;height:24px;cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.mini-nav-btn:hover{background:var(--bg2);}
.mini-cal-grid{width:100%;border-collapse:collapse;}
.mini-cal-grid th{font-size:10px;color:var(--text3);text-align:center;padding:0 0 6px;font-weight:500;}
.mini-cal-grid td{text-align:center;padding:1px;}
.mini-day{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--text);cursor:pointer;background:transparent;border:none;font-family:var(--font);}
.mini-day:hover{background:var(--bg3);}
.mini-day.m-today{background:var(--accent);color:var(--bg);font-weight:600;}
.mini-day.m-inweek{background:var(--accent-light);}
.mini-day.m-inweek.m-today{background:var(--accent);color:var(--bg);}
.mini-day.m-other{color:var(--text3);}
.week-nav-btn{background:transparent;border:0.5px solid var(--border);border-radius:var(--radius-sm);width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.week-nav-btn:hover{background:var(--bg2);}
.week-day-block{margin-bottom:14px;}
.week-day-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.week-day-label{font-size:13px;font-weight:600;color:var(--text);min-width:64px;}
.week-day-label.today-day{color:var(--accent);}
.fixed-tag{font-size:11px;color:var(--text2);background:var(--bg3);border:0.5px solid var(--border);border-radius:999px;padding:2px 9px;white-space:nowrap;}
.todo-list{display:flex;flex-direction:column;gap:7px;padding-left:4px;}
.todo-item{display:flex;align-items:center;gap:9px;}
.todo-item input[type="checkbox"]{width:15px;height:15px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
.todo-item .todo-text{flex:1;background:transparent;border:none;border-bottom:0.5px solid var(--border);outline:none;font-family:var(--font);font-size:13px;color:var(--text);padding:3px 0;}
.todo-item .todo-text::placeholder{color:var(--text3);}
.todo-item .todo-text.done-text{text-decoration:line-through;color:var(--text3);}
.todo-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:17px;line-height:1;padding:0;}
.todo-del:hover{color:#e24b4a;}
.add-todo-btn{display:flex;align-items:center;gap:6px;background:transparent;border:none;font-family:var(--font);font-size:12px;color:var(--text3);cursor:pointer;padding:3px 0 0 4px;margin-top:4px;}
.add-todo-btn:hover{color:var(--text2);}
.week-divider{height:0.5px;background:var(--border);margin:14px 0;}
.goal-section-title{font-size:11px;font-weight:600;letter-spacing:0.07em;color:var(--text3);text-transform:uppercase;margin-bottom:10px;}
.goal-item{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.goal-pname{font-size:12px;color:var(--text2);min-width:90px;}
.goal-input{flex:1;background:transparent;border:none;border-bottom:0.5px solid var(--border);outline:none;font-family:var(--font);font-size:13px;color:var(--text);padding:3px 0;}
.goal-input::placeholder{color:var(--text3);}

/* Calendar */
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month-label{font-size:15px;font-weight:600;color:var(--text);}
.cal-grid{width:100%;border-collapse:collapse;margin-bottom:18px;}
.cal-grid th{font-size:11px;color:var(--text3);text-align:center;padding:0 0 8px;font-weight:500;}
.cal-grid td{text-align:center;padding:3px;}
.cal-day-btn{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);cursor:pointer;background:transparent;border:none;position:relative;font-family:var(--font);transition:background 0.1s;}
.cal-day-btn:hover{background:var(--bg3);}
.cal-day-btn.today{background:var(--accent);color:var(--bg);font-weight:600;}
.cal-day-btn.other{color:var(--text3);}
.cal-day-btn.in-selected-week{background:var(--accent-light);}
.cal-day-btn.in-selected-week.today{background:var(--accent);color:var(--bg);}
.cal-day-btn.has-event::after{content:'';width:4px;height:4px;border-radius:50%;background:#378ADD;position:absolute;bottom:3px;left:50%;transform:translateX(-50%);}
.cal-day-btn.today.has-event::after{background:#90caf9;}
.event-list{display:flex;flex-direction:column;gap:7px;}
.event-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:var(--radius-sm);padding:8px 12px;}
.event-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.event-date-lbl{font-size:11px;color:var(--text2);min-width:46px;}
.event-name{font-size:13px;color:var(--text);flex:1;}
.event-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0;line-height:1;}
.event-del:hover{color:#e24b4a;}

/* Modals */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.28);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:var(--radius);padding:22px;width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.12);}
.modal-title{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text);}
.modal-field{margin-bottom:14px;}
.modal-label{font-size:12px;color:var(--text2);margin-bottom:5px;}
.modal-input{width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);outline:none;}
.modal-input:focus{border-color:var(--accent);}
.modal-select{width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);outline:none;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg);color:var(--text);}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.btn:hover{opacity:0.8;}

/* Settings */
.settings-modal{background:var(--bg);border-radius:var(--radius);padding:22px;width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.12);}
.settings-tabs{display:flex;gap:0;border-bottom:0.5px solid var(--border);margin-bottom:20px;}
.stab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-0.5px;}
.stab.active{color:var(--text);border-bottom:2px solid var(--accent);}
.spane{display:none;}.spane.active{display:block;}
.settings-section{margin-bottom:20px;}
.settings-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px;}
.proj-edit-row{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:0.5px solid var(--border);flex-direction:column;}
.proj-edit-top{display:flex;align-items:center;gap:8px;width:100%;}
.proj-edit-input{flex:1;background:transparent;border:none;outline:none;font-family:var(--font);font-size:13px;color:var(--text);}
.proj-edit-select{border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:3px 6px;font-family:var(--font);font-size:12px;color:var(--text);background:var(--bg);outline:none;}
.proj-del-btn{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:0;line-height:1;flex-shrink:0;}
.proj-del-btn:hover{color:#e24b4a;}
.cl-edit-area{width:100%;padding-left:4px;}
.cl-edit-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.cl-edit-input{flex:1;background:transparent;border:none;border-bottom:0.5px solid var(--border);outline:none;font-family:var(--font);font-size:12px;color:var(--text);padding:2px 0;}
.cl-edit-input::placeholder{color:var(--text3);}
.cl-item-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:0;line-height:1;}
.cl-item-del:hover{color:#e24b4a;}
.add-cl-btn{background:transparent;border:none;font-family:var(--font);font-size:12px;color:var(--text3);cursor:pointer;padding:2px 0;}
.add-cl-btn:hover{color:var(--text2);}
.add-proj-btn{display:flex;align-items:center;gap:6px;background:transparent;border:0.5px dashed var(--border2);border-radius:var(--radius-sm);padding:8px 12px;font-family:var(--font);font-size:13px;color:var(--text2);cursor:pointer;width:100%;margin-top:8px;}
.add-proj-btn:hover{background:var(--bg2);}
.fixed-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.fixed-edit-row:last-child{border-bottom:none;}
.fixed-day-lbl{font-size:12px;font-weight:600;color:var(--text2);min-width:22px;}
.fixed-edit-input{flex:1;background:transparent;border:none;outline:none;font-family:var(--font);font-size:13px;color:var(--text);}
.fixed-edit-input::placeholder{color:var(--text3);}
.color-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.color-label{font-size:13px;color:var(--text);min-width:100px;}
.color-swatch{width:32px;height:32px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);cursor:pointer;padding:0;}
.appearance-input{width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);outline:none;margin-bottom:10px;}

/* Settings trigger */
.settings-btn{position:fixed;bottom:20px;right:20px;width:40px;height:40px;background:var(--accent);color:var(--bg);border:none;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:50;}
.settings-btn:hover{opacity:0.85;}
.divider{height:0.5px;background:var(--border);margin:14px 0;}
.empty-msg{font-size:13px;color:var(--text3);padding:8px 0;}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="app-title" id="app-title-el">My Planner</div>
    <div id="sync-status" style="font-size:12px;color:var(--text3);"></div>
  </div>

  <!-- HOME = PROJ -->
  <div class="card" id="home-card">
    <div class="section-label" id="home-label-el">Projects</div>
    <table class="base-table">
      <thead><tr>
        <th style="width:32%">프로젝트</th>
        <th style="width:20%">상태</th>
        <th>다음 할 것</th>
        <th style="width:36px"></th>
      </tr></thead>
      <tbody id="home-body"></tbody>
    </table>
  </div>

  <!-- TABS -->
  <div class="tab-section">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('weekly',this)">Weekly</button>
      <button class="tab-btn" onclick="switchTab('cal',this)">Calendar</button>
    </div>

    <!-- WEEKLY -->
    <div class="tab-pane active" id="tab-weekly">
      <div class="week-nav">
        <button class="week-nav-btn" onclick="changeWeek(-1)">&#8249;</button>
        <button class="week-range" id="week-range-label" onclick="openMiniCal(event)"></button>
        <button class="week-nav-btn" onclick="changeWeek(1)">&#8250;</button>
      </div>
      <div id="week-days-container"></div>
      <div class="week-divider"></div>
      <div class="goal-section-title">이번 주 집중 목표</div>
      <div id="goal-list"></div>
    </div>

    <!-- CALENDAR -->
    <div class="tab-pane" id="tab-cal">
      <div class="cal-nav-row">
        <button class="week-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <div class="cal-month-label" id="cal-month-label"></div>
        <button class="week-nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
      <table class="cal-grid">
        <thead><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead>
        <tbody id="cal-body"></tbody>
      </table>
      <div class="section-label">일정 목록</div>
      <div class="event-list" id="event-list"></div>
    </div>
  </div>
</div>

<!-- Event Modal -->
<div class="modal-overlay" id="event-modal">
  <div class="modal">
    <div class="modal-title" id="event-modal-title">일정 추가</div>
    <div class="modal-field">
      <div class="modal-label">일정 이름</div>
      <input class="modal-input" id="event-name-input" placeholder="일정 입력..." />
    </div>
    <div class="modal-field">
      <div class="modal-label">색상</div>
      <select class="modal-select" id="event-color-select">
        <option value="#378ADD">파란색</option>
        <option value="#1D9E75">초록색</option>
        <option value="#D85A30">주황색</option>
        <option value="#D4537E">분홍색</option>
        <option value="#7F77DD">보라색</option>
        <option value="#888780">회색</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeEventModal()">취소</button>
      <button class="btn btn-primary" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<!-- Mini Calendar Popup -->
<div class="mini-cal-overlay" id="mini-cal-overlay" onclick="closeMiniCal()"></div>
<div class="mini-cal-popup" id="mini-cal-popup" style="display:none;">
  <div class="mini-cal-nav">
    <button class="mini-nav-btn" onclick="miniChangeMonth(-1)">&#8249;</button>
    <div class="mini-cal-label" id="mini-cal-label"></div>
    <button class="mini-nav-btn" onclick="miniChangeMonth(1)">&#8250;</button>
  </div>
  <table class="mini-cal-grid">
    <thead><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead>
    <tbody id="mini-cal-body"></tbody>
  </table>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="settings-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div style="font-size:15px;font-weight:600;">설정</div>
      <button class="btn" onclick="closeSettings()">닫기</button>
    </div>
    <div class="settings-tabs">
      <button class="stab active" onclick="switchStab('appearance',this)">외관</button>
      <button class="stab" onclick="switchStab('projects',this)">프로젝트</button>
      <button class="stab" onclick="switchStab('schedule',this)">고정 일정</button>
    </div>

    <!-- Appearance -->
    <div class="spane active" id="spane-appearance">
      <div class="settings-section">
        <div class="settings-section-title">플래너 이름</div>
        <input class="appearance-input" id="s-planner-name" placeholder="My Planner" />
      </div>
      <div class="settings-section">
        <div class="settings-section-title">섹션 이름</div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <span style="font-size:13px;color:var(--text2);min-width:80px;">홈 섹션</span>
          <input class="appearance-input" id="s-home-label" placeholder="Projects" style="margin-bottom:0;flex:1;" />
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">색상</div>
        <div class="color-row">
          <span class="color-label">배경색</span>
          <input type="color" id="c-bg2" class="color-swatch" />
        </div>
        <div class="color-row">
          <span class="color-label">카드 색</span>
          <input type="color" id="c-bg" class="color-swatch" />
        </div>
        <div class="color-row">
          <span class="color-label">강조색 (탭·버튼)</span>
          <input type="color" id="c-accent" class="color-swatch" />
        </div>
        <div class="color-row">
          <span class="color-label">텍스트 색</span>
          <input type="color" id="c-text" class="color-swatch" />

function getMondayStr(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day===0)?-6:1-day;
  dt.setDate(dt.getDate()+diff);
  return dt.toISOString().slice(0,10);
}
function addDays(str,n){
  const d=new Date(str);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);
}
function formatDateKo(str){
  const d=new Date(str);
  return (d.getMonth()+1)+'월 '+d.getDate()+'일';
}
function isToday(str){
  const t=new Date();
  const ts=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  return str===ts;
}

const SUPA_URL="https://ixyfblksaszjpuyfsttv.supabase.co";
const SUPA_KEY="sb_publishable__p241TRxpekmNgKUsMYCZw_xNkrkvGX";

let S={};
let saveTimer=null;

async function load(){
  // Show loading
  document.getElementById('sync-status').textContent='불러오는 중...';
  try{
    const res=await fetch(SUPA_URL+'/rest/v1/planner_data?id=eq.main&select=data',{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    const rows=await res.json();
    if(rows&&rows.length&&rows[0].data&&Object.keys(rows[0].data).length>0){
      S=rows[0].data;
    } else {
      S=JSON.parse(JSON.stringify(DEFAULT));
    }
  } catch(e){
    // fallback to localStorage
    try{const r=localStorage.getItem('plannerv3');if(r)S=JSON.parse(r);else S=JSON.parse(JSON.stringify(DEFAULT));}
    catch(e2){S=JSON.parse(JSON.stringify(DEFAULT));}
  }
  ['plannerName','homeLabel','colors','projects','fixed','goals','weekTodos','events','nextId','calYear','calMonth','selectedWeekMonday'].forEach(k=>{
    if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEFAULT[k]));
  });
  document.getElementById('sync-status').textContent='';
}

function save(){
  // Save to localStorage immediately as backup
  try{localStorage.setItem('plannerv3',JSON.stringify(S));}catch(e){}
  // Debounce Supabase save
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    document.getElementById('sync-status').textContent='저장 중...';
    try{
      await fetch(SUPA_URL+'/rest/v1/planner_data?id=eq.main',{
        method:'PATCH',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({data:S,updated_at:new Date().toISOString()})
      });
      document.getElementById('sync-status').textContent='✓ 저장됨';
      setTimeout(()=>document.getElementById('sync-status').textContent='',2000);
    } catch(e){
      document.getElementById('sync-status').textContent='⚠ 저장 실패 (오프라인)';
    }
  },800);
}

function renderWeekly(){
  const mon=S.selectedWeekMonday;
  const sun=addDays(mon,6);
  document.getElementById('week-range-label').textContent=formatDateKo(mon)+' – '+formatDateKo(sun);
  const container=document.getElementById('week-days-container');
  container.innerHTML='';
  DAYS_KO.forEach((d,i)=>{
    const dateStr=addDays(mon,i);
    const todayClass=isToday(dateStr)?' today-day':'';
    const fixed=S.fixed[d]||'';
    const todos=S.weekTodos[dateStr]||[];
    const block=document.createElement('div');
    block.className='week-day-block';
    const dayEvents=(S.events||[]).filter(ev=>ev.date===dateStr);
    const eventTagsHtml=dayEvents.map(ev=>`<span class="event-tag" style="background:${ev.color||'#378ADD'}">${esc(ev.name)}</span>`).join('');
    block.innerHTML=`
      <div class="week-day-header">
        <div class="week-day-label${todayClass}">${d} <span style="font-size:12px;font-weight:400;color:var(--text2);">${formatDateKo(dateStr)}</span></div>
        ${fixed?`<span class="fixed-tag">${esc(fixed)}</span>`:''}
        ${eventTagsHtml}
      </div>
      <div class="todo-list" id="tl_${dateStr}"></div>
      <button class="add-todo-btn" onclick="addTodo('${dateStr}')">+ 추가</button>
    `;
    if(i<6){const div2=document.createElement('div');div2.className='week-divider';container.appendChild(block);container.appendChild(div2);}
    else container.appendChild(block);
    renderDayTodos(dateStr);
  });
  const gl=document.getElementById('goal-list');
  gl.innerHTML='';
  S.projects.forEach(p=>{
    const div=document.createElement('div');
    div.className='goal-item';
    div.innerHTML=`<span class="goal-pname">${p.name}</span><input class="goal-input" data-pid="${p.id}" value="${esc(S.goals[p.id]||'')}" placeholder="이번 주 목표" />`;
    gl.appendChild(div);
  });
  gl.querySelectorAll('.goal-input').forEach(inp=>{
    inp.addEventListener('input',e=>{S.goals[e.target.dataset.pid]=e.target.value;save();});
  });
}

function renderDayTodos(dateStr){
  const tl=document.getElementById('tl_'+dateStr);
  if(!tl)return;
  tl.innerHTML='';
  const todos=S.weekTodos[dateStr]||[];
  todos.forEach((todo,idx)=>{
    const div=document.createElement('div');
    div.className='todo-item';
    div.innerHTML=`<input type="checkbox" ${todo.done?'checked':''} /><input type="text" class="todo-text${todo.done?' done-text':''}" value="${esc(todo.text||'')}" placeholder="할 것 입력" /><button class="todo-del">×</button>`;
    tl.appendChild(div);
    div.querySelector('input[type="checkbox"]').addEventListener('change',e=>{
      S.weekTodos[dateStr][idx].done=e.target.checked;
      div.querySelector('.todo-text').classList.toggle('done-text',e.target.checked);
      save();
    });
    div.querySelector('.todo-text').addEventListener('input',e=>{
      S.weekTodos[dateStr][idx].text=e.target.value;save();
    });
    div.querySelector('.todo-del').addEventListener('click',()=>{
      S.weekTodos[dateStr].splice(idx,1);save();renderDayTodos(dateStr);
    });
  });
}

function addTodo(dateStr){
  if(!S.weekTodos[dateStr])S.weekTodos[dateStr]=[];
  S.weekTodos[dateStr].push({text:'',done:false});
  save();renderDayTodos(dateStr);
  setTimeout(()=>{
    const tl=document.getElementById('tl_'+dateStr);
    if(tl){const inputs=tl.querySelectorAll('.todo-text');if(inputs.length)inputs[inputs.length-1].focus();}

}

/* ---- CALENDAR ---- */
let pendingDate=null;

function renderCalendar(){
  const yr=S.calYear,mo=S.calMonth;
  document.getElementById('cal-month-label').textContent=yr+'년 '+MONTHS_KO[mo];
  const body=document.getElementById('cal-body');
  body.innerHTML='';
  const today=new Date();
  const firstDay=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const daysInPrev=new Date(yr,mo,0).getDate();
  const eventDates={};
  S.events.forEach(ev=>{if(ev.date)eventDates[ev.date]=ev.color||'#378ADD';});
  const selMon=S.selectedWeekMonday;
  const selSun=addDays(selMon,6);
  let cells=[];
  for(let i=firstDay-1;i>=0;i--)cells.push({d:daysInPrev-i,other:true});
  for(let d=1;d<=daysInMonth;d++)cells.push({d,other:false});
  while(cells.length%7!==0)cells.push({d:cells.length-firstDay-daysInMonth+1,other:true});
  for(let r=0;r<cells.length/7;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<7;c++){
      const cell=cells[r*7+c];
      const td=document.createElement('td');
      const dateStr=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(cell.d).padStart(2,'0');
      const isTod=!cell.other&&cell.d===today.getDate()&&mo===today.getMonth()&&yr===today.getFullYear();
      const hasEv=!cell.other&&eventDates[dateStr];
      const inSelWeek=!cell.other&&dateStr>=selMon&&dateStr<=selSun;
      const btn=document.createElement('button');
      btn.className='cal-day-btn'+(cell.other?' other':'')+(isTod?' today':'')+(hasEv?' has-event':'')+(inSelWeek?' in-selected-week':'');
      btn.textContent=cell.d;
      if(!cell.other)btn.onclick=()=>onCalDayClick(dateStr);
      td.appendChild(btn);tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  renderEventList();
}

function onCalDayClick(dateStr){
  openEventModal(dateStr);
}

function renderEventList(){
  const el=document.getElementById('event-list');
  el.innerHTML='';
  const sorted=[...S.events].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  sorted.forEach(ev=>{
    const div=document.createElement('div');div.className='event-item';
    const parts=ev.date?ev.date.split('-'):['','',''];
    const lbl=ev.date?parseInt(parts[1])+'/'+parseInt(parts[2]):'—';
    div.innerHTML=`<div class="event-dot" style="background:${ev.color||'#378ADD'}"></div><span class="event-date-lbl">${lbl}</span><span class="event-name">${esc(ev.name)}</span><button class="event-del" onclick="deleteEvent(${ev.id})">×</button>`;
    el.appendChild(div);
  });
  if(!sorted.length)el.innerHTML='<div class="empty-msg">날짜를 클릭해서 일정을 추가해줘</div>';
}

function changeMonth(dir){
  S.calMonth+=dir;
  if(S.calMonth>11){S.calMonth=0;S.calYear++;}

document.getElementById('settings-modal').addEventListener('click',e=>{if(e.target===document.getElementById('settings-modal'))closeSettings();});

/* ---- Tab ---- */
function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="${name}"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---- MINI CALENDAR ---- */
let miniCalYear=new Date().getFullYear();
let miniCalMonth=new Date().getMonth();

function openMiniCal(e){
  e.stopPropagation();
  miniCalYear=new Date().getFullYear();
  miniCalMonth=new Date().getMonth();
  renderMiniCal();
  const popup=document.getElementById('mini-cal-popup');
  const overlay=document.getElementById('mini-cal-overlay');
  const btn=document.getElementById('week-range-label');
  const rect=btn.getBoundingClientRect();
  popup.style.display='block';
  popup.style.top=(rect.bottom+6)+'px';
  popup.style.left=rect.left+'px';
  overlay.classList.add('open');
}
function closeMiniCal(){
  document.getElementById('mini-cal-popup').style.display='none';
  document.getElementById('mini-cal-overlay').classList.remove('open');
}
function miniChangeMonth(dir){
  miniCalMonth+=dir;
  if(miniCalMonth>11){miniCalMonth=0;miniCalYear++;}
  if(miniCalMonth<0){miniCalMonth=11;miniCalYear--;}
  renderMiniCal();
}
function renderMiniCal(){
  document.getElementById('mini-cal-label').textContent=miniCalYear+'년 '+MONTHS_KO[miniCalMonth];
  const body=document.getElementById('mini-cal-body');
  body.innerHTML='';
  const today=new Date();
  const firstDay=new Date(miniCalYear,miniCalMonth,1).getDay();
  const daysInMonth=new Date(miniCalYear,miniCalMonth+1,0).getDate();
  const daysInPrev=new Date(miniCalYear,miniCalMonth,0).getDate();
  const selMon=S.selectedWeekMonday;
  const selSun=addDays(selMon,6);
  let cells=[];
  for(let i=firstDay-1;i>=0;i--)cells.push({d:daysInPrev-i,other:true});
  for(let d=1;d<=daysInMonth;d++)cells.push({d,other:false});
  while(cells.length%7!==0)cells.push({d:cells.length-firstDay-daysInMonth+1,other:true});
  for(let r=0;r<cells.length/7;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<7;c++){
      const cell=cells[r*7+c];
      const td=document.createElement('td');
      const dateStr=miniCalYear+'-'+String(miniCalMonth+1).padStart(2,'0')+'-'+String(cell.d).padStart(2,'0');
      const isTod=!cell.other&&cell.d===today.getDate()&&miniCalMonth===today.getMonth()&&miniCalYear===today.getFullYear();
      const inWeek=!cell.other&&dateStr>=selMon&&dateStr<=selSun;
      const btn=document.createElement('button');
      btn.className='mini-day'+(cell.other?' m-other':'')+(isTod?' m-today':'')+(inWeek?' m-inweek':'');
      btn.textContent=cell.d;
      if(!cell.other){
        btn.onclick=()=>{
          S.selectedWeekMonday=getMondayStr(new Date(dateStr));
          save();renderWeekly();closeMiniCal();
        };
      }
      td.appendChild(btn);tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}
