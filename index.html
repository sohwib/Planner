<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Planner</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#efefec;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.18);
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#b0b0b0;
  --accent:#1a1a1a;--accent-light:rgba(26,26,26,0.08);
  --green-bg:#eaf3de;--green-text:#3b6d11;
  --blue-bg:#e6f1fb;--blue-text:#185fa5;
  --gray-bg:#f1efe8;--gray-text:#5f5e5a;
  --done-bg:#e8f5e9;--done-text:#2e7d32;
  --radius:10px;--radius-sm:6px;
  --font:'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg2);color:var(--text);font-size:14px;min-height:100vh;}
.app{max-width:740px;margin:0 auto;padding:24px 16px 80px;}

/* Header */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.app-title{font-size:18px;font-weight:700;color:var(--text);}
.sync-status{font-size:12px;color:var(--text3);}

/* Card */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.07em;color:var(--text3);text-transform:uppercase;margin-bottom:12px;}

/* Table */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:11px;color:var(--text3);font-weight:500;text-align:left;padding:0 8px 8px 0;border-bottom:0.5px solid var(--border);}
.tbl td{padding:9px 8px 9px 0;border-bottom:0.5px solid var(--border);vertical-align:middle;font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}

/* Badge */
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500;}
.b-active{background:var(--green-bg);color:var(--green-text);}
.b-start{background:var(--blue-bg);color:var(--blue-text);}
.b-wait{background:var(--gray-bg);color:var(--gray-text);}
.b-done{background:var(--done-bg);color:var(--done-text);}

/* Inputs */
.bare-input{background:transparent;border:none;outline:none;font-family:var(--font);font-size:13px;color:var(--text);width:100%;}
.bare-input::placeholder{color:var(--text3);}

/* Tabs */
.tab-section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.tab-bar{display:flex;border-bottom:0.5px solid var(--border);background:var(--bg2);}
.tab-btn{padding:11px 20px;font-size:13px;font-weight:500;color:var(--text2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-0.5px;}
.tab-btn.active{color:var(--text);border-bottom:2px solid var(--accent);background:var(--bg);}
.tab-pane{display:none;padding:18px;}
.tab-pane.active{display:block;}

/* Checklist */
.cl-btn{background:transparent;border:0.5px solid var(--border);border-radius:var(--radius-sm);width:28px;height:28px;cursor:pointer;font-size:14px;color:var(--text2);}
.cl-btn:hover{background:var(--bg2);}
.cl-panel{display:none;background:var(--bg2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:4px;flex-direction:column;gap:8px;}
.cl-panel.open{display:flex;}
.cl-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;}
.cl-row input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
.cl-done{text-decoration:line-through;color:var(--text3);}

/* Weekly */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.week-range{font-size:14px;font-weight:600;color:var(--text);cursor:pointer;background:none;border:none;font-family:var(--font);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border2);}
.week-range:hover{opacity:0.7;}
.nav-btn{background:transparent;border:0.5px solid var(--border);border-radius:var(--radius-sm);width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.nav-btn:hover{background:var(--bg2);}
.day-block{margin-bottom:14px;}
.day-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.day-label{font-size:13px;font-weight:600;color:var(--text);min-width:60px;}
.day-label.is-today{color:var(--accent);}
.fixed-tag{font-size:11px;color:var(--text2);background:var(--bg3);border:0.5px solid var(--border);border-radius:999px;padding:2px 9px;white-space:nowrap;}
.event-tag{font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500;color:#fff;}
.todo-list{display:flex;flex-direction:column;gap:7px;padding-left:4px;}
.todo-item{display:flex;align-items:center;gap:9px;}
.todo-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
.todo-text{flex:1;background:transparent;border:none;border-bottom:0.5px solid var(--border);outline:none;font-family:var(--font);font-size:13px;color:var(--text);padding:3px 0;}
.todo-text::placeholder{color:var(--text3);}
.todo-text.done{text-decoration:line-through;color:var(--text3);}
.todo-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:17px;line-height:1;padding:0;}
.todo-del:hover{color:#e24b4a;}
.add-todo{background:transparent;border:none;font-family:var(--font);font-size:12px;color:var(--text3);cursor:pointer;padding:3px 0 0 4px;margin-top:4px;display:flex;align-items:center;gap:4px;}
.add-todo:hover{color:var(--text2);}
.day-divider{height:0.5px;background:var(--border);margin:14px 0;}
.goal-title{font-size:11px;font-weight:600;letter-spacing:0.07em;color:var(--text3);text-transform:uppercase;margin-bottom:10px;}
.goal-item{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.goal-name{font-size:12px;color:var(--text2);min-width:90px;}
.goal-input{flex:1;background:transparent;border:none;border-bottom:0.5px solid var(--border);outline:none;font-family:var(--font);font-size:13px;color:var(--text);padding:3px 0;}
.goal-input::placeholder{color:var(--text3);}

/* Calendar */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month{font-size:15px;font-weight:600;}
.cal-grid{width:100%;border-collapse:collapse;margin-bottom:18px;}
.cal-grid th{font-size:11px;color:var(--text3);text-align:center;padding:0 0 8px;font-weight:500;}
.cal-grid td{text-align:center;padding:3px;}
.cal-day{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);cursor:pointer;background:transparent;border:none;font-family:var(--font);position:relative;}
.cal-day:hover{background:var(--bg3);}
.cal-day.is-today{background:var(--accent);color:var(--bg);font-weight:600;}
.cal-day.other{color:var(--text3);}
.cal-day.has-event::after{content:'';width:4px;height:4px;border-radius:50%;background:#378ADD;position:absolute;bottom:3px;left:50%;transform:translateX(-50%);}
.cal-day.is-today.has-event::after{background:#90caf9;}
.ev-list{display:flex;flex-direction:column;gap:7px;}
.ev-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:var(--radius-sm);padding:8px 12px;}
.ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ev-date{font-size:11px;color:var(--text2);min-width:46px;}
.ev-name{font-size:13px;color:var(--text);flex:1;}
.ev-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0;line-height:1;}
.ev-del:hover{color:#e24b4a;}

/* Mini calendar */
.mini-overlay{display:none;position:fixed;inset:0;z-index:200;}
.mini-overlay.open{display:block;}
.mini-popup{display:none;position:fixed;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:14px;width:240px;box-shadow:0 8px 24px rgba(0,0,0,0.14);z-index:201;}
.mini-popup.open{display:block;}
.mini-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mini-label{font-size:13px;font-weight:600;}
.mini-btn{background:transparent;border:0.5px solid var(--border);border-radius:var(--radius-sm);width:24px;height:24px;cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.mini-btn:hover{background:var(--bg2);}
.mini-grid{width:100%;border-collapse:collapse;}
.mini-grid th{font-size:10px;color:var(--text3);text-align:center;padding:0 0 6px;font-weight:500;}
.mini-grid td{text-align:center;padding:1px;}
.mini-day{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--text);cursor:pointer;background:transparent;border:none;font-family:var(--font);}
.mini-day:hover{background:var(--bg3);}
.mini-day.m-today{background:var(--accent);color:var(--bg);font-weight:600;}
.mini-day.m-inweek{background:var(--accent-light);}
.mini-day.m-inweek.m-today{background:var(--accent);color:var(--bg);}
.mini-day.m-other{color:var(--text3);}

/* Modals */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.28);z-index:100;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:var(--radius);padding:22px;width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.12);}
.modal-title{font-size:14px;font-weight:600;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field-label{font-size:12px;color:var(--text2);margin-bottom:5px;}
.field-input{width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);outline:none;}
.field-input:focus{border-color:var(--accent);}
.field-select{width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);outline:none;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg);color:var(--text);}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.btn:hover{opacity:0.8;}

/* Settings */
.settings-modal{background:var(--bg);border-radius:var(--radius);padding:22px;width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.12);}
.stab-bar{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:20px;}
.stab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-0.5px;}
.stab.active{color:var(--text);border-bottom:2px solid var(--accent);}
.spane{display:none;}.spane.active{display:block;}
.s-section{margin-bottom:20px;}
.s-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px;}
.s-input{width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);outline:none;margin-bottom:10px;}
.color-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.color-lbl{font-size:13px;color:var(--text);min-width:110px;}
.color-pick{width:32px;height:32px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);cursor:pointer;padding:0;}
.proj-row{display:flex;flex-direction:column;padding:10px 0;border-bottom:0.5px solid var(--border);}
.proj-row:last-child{border-bottom:none;}
.proj-row-top{display:flex;align-items:center;gap:8px;width:100%;}
.proj-name-input{flex:1;background:transparent;border:none;outline:none;font-family:var(--font);font-size:13px;color:var(--text);}
.proj-status-sel{border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:3px 6px;font-family:var(--font);font-size:12px;color:var(--text);background:var(--bg);outline:none;}
.proj-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;flex-shrink:0;}
.proj-del:hover{color:#e24b4a;}
.cl-edit-area{padding-left:4px;margin-top:6px;}
.cl-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.cl-edit-input{flex:1;background:transparent;border:none;border-bottom:0.5px solid var(--border);outline:none;font-family:var(--font);font-size:12px;color:var(--text);padding:2px 0;}
.cl-edit-input::placeholder{color:var(--text3);}
.cl-item-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:15px;line-height:1;}
.cl-item-del:hover{color:#e24b4a;}
.add-cl{background:transparent;border:none;font-family:var(--font);font-size:12px;color:var(--text3);cursor:pointer;padding:2px 0;margin-top:2px;}
.add-cl:hover{color:var(--text2);}
.add-proj{display:flex;align-items:center;gap:6px;background:transparent;border:0.5px dashed var(--border2);border-radius:var(--radius-sm);padding:8px 12px;font-family:var(--font);font-size:13px;color:var(--text2);cursor:pointer;width:100%;margin-top:8px;}
.add-proj:hover{background:var(--bg2);}
.fixed-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.fixed-row:last-child{border-bottom:none;}
.fixed-day{font-size:12px;font-weight:600;color:var(--text2);min-width:22px;}
.fixed-input{flex:1;background:transparent;border:none;outline:none;font-family:var(--font);font-size:13px;color:var(--text);}
.fixed-input::placeholder{color:var(--text3);}

/* FAB */
.fab{position:fixed;bottom:20px;right:20px;width:40px;height:40px;background:var(--accent);color:var(--bg);border:none;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:50;}
.fab:hover{opacity:0.85;}
.divider{height:0.5px;background:var(--border);margin:14px 0;}

/* Password screen */
.pw-screen{position:fixed;inset:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;z-index:999;}
.pw-box{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:32px;width:300px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.pw-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;}
.pw-sub{font-size:13px;color:var(--text2);margin-bottom:20px;}
.pw-input{width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);outline:none;text-align:center;letter-spacing:0.1em;margin-bottom:12px;}
.pw-input:focus{border-color:var(--accent);}
.pw-btn{width:100%;padding:10px;background:var(--accent);color:var(--bg);border:none;border-radius:var(--radius-sm);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;}
.pw-btn:hover{opacity:0.85;}
.pw-error{font-size:12px;color:#e24b4a;margin-top:8px;min-height:16px;}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="app-title" id="title-el">My Planner</div>
    <div class="sync-status" id="sync-el"></div>
  </div>

  <!-- HOME -->
  <div class="card">
    <div class="section-label" id="home-label-el">Projects</div>
    <table class="tbl">
      <thead><tr>
        <th style="width:32%">프로젝트</th>
        <th style="width:20%">상태</th>
        <th>다음 할 것</th>
        <th style="width:36px"></th>
      </tr></thead>
      <tbody id="home-body"></tbody>
    </table>
  </div>

  <!-- TABS -->
  <div class="tab-section">
    <div class="tab-bar">
      <button class="tab-btn active" id="tbtn-weekly" onclick="switchTab('weekly')">Weekly</button>
      <button class="tab-btn" id="tbtn-cal" onclick="switchTab('cal')">Calendar</button>
    </div>

    <!-- WEEKLY -->
    <div class="tab-pane active" id="tab-weekly">
      <div class="week-nav">
        <button class="nav-btn" onclick="changeWeek(-1)">&#8249;</button>
        <button class="week-range" id="week-range-btn" onclick="openMiniCal(event)">...</button>
        <button class="nav-btn" onclick="changeWeek(1)">&#8250;</button>
      </div>
      <div id="week-container"></div>
      <div class="divider"></div>
      <div class="goal-title">이번 주 집중 목표</div>
      <div id="goal-list"></div>
    </div>

    <!-- CALENDAR -->
    <div class="tab-pane" id="tab-cal">
      <div class="cal-header">
        <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <div class="cal-month" id="cal-month-el"></div>
        <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
      <table class="cal-grid">
        <thead><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead>
        <tbody id="cal-body"></tbody>
      </table>
      <div class="section-label">일정 목록</div>
      <div class="ev-list" id="ev-list"></div>
    </div>
  </div>
</div>

<!-- Mini calendar -->
<div class="mini-overlay" id="mini-overlay" onclick="closeMiniCal()"></div>
<div class="mini-popup" id="mini-popup">
  <div class="mini-header">
    <button class="mini-btn" onclick="miniMonth(-1)">&#8249;</button>
    <div class="mini-label" id="mini-label"></div>
    <button class="mini-btn" onclick="miniMonth(1)">&#8250;</button>
  </div>
  <table class="mini-grid">
    <thead><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead>
    <tbody id="mini-body"></tbody>
  </table>
</div>

<!-- Event modal -->
<div class="overlay" id="ev-modal">
  <div class="modal">
    <div class="modal-title" id="ev-modal-title">일정 추가</div>
    <div class="field">
      <div class="field-label">일정 이름</div>
      <input class="field-input" id="ev-name" placeholder="일정 입력..."/>
    </div>
    <div class="field">
      <div class="field-label">색상</div>
      <select class="field-select" id="ev-color">
        <option value="#378ADD">파란색</option>
        <option value="#1D9E75">초록색</option>
        <option value="#D85A30">주황색</option>
        <option value="#D4537E">분홍색</option>
        <option value="#7F77DD">보라색</option>
        <option value="#888780">회색</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeEvModal()">취소</button>
      <button class="btn btn-primary" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="settings-overlay">
  <div class="settings-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div style="font-size:15px;font-weight:600;">설정</div>
      <button class="btn" onclick="closeSettings()">닫기</button>
    </div>
    <div class="stab-bar">
      <button class="stab active" onclick="switchStab('appearance',this)">외관</button>
      <button class="stab" onclick="switchStab('projects',this)">프로젝트</button>
      <button class="stab" onclick="switchStab('schedule',this)">고정 일정</button>
    </div>
    <div class="spane active" id="spane-appearance">
      <div class="s-section">
        <div class="s-title">플래너 이름</div>
        <input class="s-input" id="s-name" placeholder="My Planner"/>
      </div>
      <div class="s-section">
        <div class="s-title">홈 섹션 이름</div>
        <input class="s-input" id="s-homelabel" placeholder="Projects"/>
      </div>
      <div class="s-section">
        <div class="s-title">색상</div>
        <div class="color-row"><span class="color-lbl">배경색</span><input type="color" class="color-pick" id="c-bg2"/></div>
        <div class="color-row"><span class="color-lbl">카드 색</span><input type="color" class="color-pick" id="c-bg"/></div>
        <div class="color-row"><span class="color-lbl">강조색</span><input type="color" class="color-pick" id="c-accent"/></div>
        <div class="color-row"><span class="color-lbl">텍스트 색</span><input type="color" class="color-pick" id="c-text"/></div>
      </div>
      <button class="btn" onclick="resetColors()">기본값 초기화</button>
    </div>

<script>
// ── Constants ──────────────────────────────────────────────
const SUPA_URL = "https://ixyfblksaszjpuyfsttv.supabase.co";
const SUPA_KEY = "sb_publishable__p241TRxpekmNgKUsMYCZw_xNkrkvGX";
const DAYS = ['월','화','수','목','금','토','일'];
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const STATUSES = ['진행중','시작 전','대기','완료'];

// ── Default state ──────────────────────────────────────────
const DEF = {
  plannerName:'My Planner',

  colors:{bg:'#ffffff',bg2:'#f7f7f5',accent:'#1a1a1a',text:'#1a1a1a'},

    {id:2,name:'📱 앱 디자인',status:'시작 전',next:'',checklist:[

    {id:3,name:'📚 모션 강의',status:'진행중',next:'',checklist:[
      {t:'강의 A 완강 (필기 위주)',d:false},{t:'강의 B 완강 (에펙 따라하기)',d:false},

  ],
  fixed:{월:'학교 미팅 새벽',화:'',수:'',목:'학교 미팅 새벽',금:'',토:'',일:'앱 미팅 + 주간계획'},
  goals:{},
  weekTodos:{},
  events:[
    {id:1,date:'2025-06-14',name:'한국 출국 + 새 노트북 구매',color:'#378ADD'},
    {id:2,date:'2025-08-31',name:'졸작 preproduction 완료 목표',color:'#D85A30'},
  ],

  calYear:new Date().getFullYear(),
  calMonth:new Date().getMonth(),
  selWeekMon:getMon(new Date()),
};

// ── State ──────────────────────────────────────────────────
let S = {};
let saveTimer = null;

// ── Supabase ───────────────────────────────────────────────
async function dbLoad() {
  setSyncStatus('불러오는 중...');
  try {
    const res = await fetch(SUPA_URL+'/rest/v1/planner_data?id=eq.main&select=data', {
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    const rows = await res.json();
    if (rows && rows.length && rows[0].data && Object.keys(rows[0].data).length > 0) {
      S = rows[0].data;
    } else {
      S = clone(DEF);
    }
  } catch(e) {
    const local = localStorage.getItem('planner_bak');
    S = local ? JSON.parse(local) : clone(DEF);
  }
  // Fill missing keys
  Object.keys(DEF).forEach(k => { if (S[k] === undefined) S[k] = clone(DEF[k]); });
  setSyncStatus('');
}

function dbSave() {
  try { localStorage.setItem('planner_bak', JSON.stringify(S)); } catch(e) {}
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    setSyncStatus('저장 중...');
    try {
      await fetch(SUPA_URL+'/rest/v1/planner_data?id=eq.main', {
        method:'PATCH',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,
          'Content-Type':'application/json','Prefer':'return=minimal'},
        body: JSON.stringify({data:S, updated_at:new Date().toISOString()})
      });
      setSyncStatus('✓ 저장됨');
      setTimeout(() => setSyncStatus(''), 2000);
    } catch(e) {
      setSyncStatus('⚠ 오프라인 (로컬 저장됨)');
    }
  }, 800);
}

function setSyncStatus(t) { document.getElementById('sync-el').textContent = t; }

// ── Helpers ────────────────────────────────────────────────
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getMon(d) {
  const dt = new Date(d); const day = dt.getDay();
  dt.setDate(dt.getDate() + (day===0 ? -6 : 1-day));
  return dt.toISOString().slice(0,10);
}
function addDays(s,n) { const d=new Date(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtKo(s) { const d=new Date(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function isToday(s) {
  const t=new Date();
  return s===t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
}
function pad(n) { return String(n).padStart(2,'0'); }
function badgeClass(s) {
  return s==='진행중'?'b-active':s==='시작 전'?'b-start':s==='완료'?'b-done':'b-wait';
}
function applyColors() {
  const c = S.colors || DEF.colors;
  const r = document.documentElement.style;
  r.setProperty('--bg', c.bg||'#ffffff');
  r.setProperty('--bg2', c.bg2||'#f7f7f5');
  r.setProperty('--accent', c.accent||'#1a1a1a');
  r.setProperty('--text', c.text||'#1a1a1a');
  r.setProperty('--accent-light', (c.accent||'#1a1a1a')+'18');
}

// ── Render HOME ────────────────────────────────────────────
function renderHome() {
  document.getElementById('title-el').textContent = S.plannerName||'My Planner';
  document.getElementById('home-label-el').textContent = S.homeLabel||'Projects';
  const tb = document.getElementById('home-body');
  tb.innerHTML = '';
  (S.projects||[]).forEach(p => {
    const clId = 'cl_'+p.id;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:500">${esc(p.name)}</td>
      <td><span class="badge ${badgeClass(p.status)}">${esc(p.status)}</span></td>
      <td><input class="bare-input" data-pid="${p.id}" value="${esc(p.next||'')}" placeholder="→ 다음 할 것"/></td>
      <td><button class="cl-btn" onclick="toggleCL('${clId}')">☰</button></td>`;
    tb.appendChild(tr);
    const tr2 = document.createElement('tr');
    tr2.innerHTML = `<td colspan="4" style="padding:0"><div class="cl-panel" id="${clId}"></div></td>`;
    tb.appendChild(tr2);
    renderCLPanel(clId, p);
  });
  tb.querySelectorAll('.bare-input').forEach(inp => {
    inp.oninput = e => {
      const p = S.projects.find(p=>p.id===+e.target.dataset.pid);
      if(p){p.next=e.target.value;dbSave();}
    };
  });
}

function renderCLPanel(clId, p) {
  const panel = document.getElementById(clId);
  if(!panel)return;
  panel.innerHTML='';
  (p.checklist||[]).forEach((item,i) => {
    const lbl = document.createElement('label');
    lbl.className='cl-row';
    lbl.innerHTML=`<input type="checkbox" ${item.d?'checked':''} data-pid="${p.id}" data-i="${i}"/><span class="${item.d?'cl-done':''}">${esc(item.t)}</span>`;
    panel.appendChild(lbl);
    lbl.querySelector('input').onchange = e => {
      const proj = S.projects.find(pp=>pp.id===+e.target.dataset.pid);
      if(proj){proj.checklist[+e.target.dataset.i].d=e.target.checked;dbSave();renderHome();}
    };
  });
}

function toggleCL(id) { document.getElementById(id).classList.toggle('open'); }

// ── Render WEEKLY ──────────────────────────────────────────
function renderWeekly() {
  const mon = S.selWeekMon;
  document.getElementById('week-range-btn').textContent = fmtKo(mon)+' – '+fmtKo(addDays(mon,6));
  const c = document.getElementById('week-container');
  c.innerHTML='';
  DAYS.forEach((d,i) => {
    const ds = addDays(mon,i);
    const fixed = S.fixed[d]||'';
    const evs = (S.events||[]).filter(ev=>ev.date===ds);
    const evHtml = evs.map(ev=>`<span class="event-tag" style="background:${ev.color||'#378ADD'}">${esc(ev.name)}</span>`).join('');
    const block = document.createElement('div');
    block.className='day-block';
    block.innerHTML=`
      <div class="day-header">
        <div class="day-label${isToday(ds)?' is-today':''}">${d} <span style="font-size:12px;font-weight:400;color:var(--text2)">${fmtKo(ds)}</span></div>
        ${fixed?`<span class="fixed-tag">${esc(fixed)}</span>`:''}
        ${evHtml}
      </div>
      <div class="todo-list" id="tl_${ds}"></div>
      <button class="add-todo" onclick="addTodo('${ds}')">+ 추가</button>`;
    c.appendChild(block);
    if(i<6){const div=document.createElement('div');div.className='day-divider';c.appendChild(div);}
    renderDayTodos(ds);
  });
  // Goals
  const gl=document.getElementById('goal-list');
  gl.innerHTML='';
  (S.projects||[]).forEach(p=>{
    const div=document.createElement('div');div.className='goal-item';
    div.innerHTML=`<span class="goal-name">${esc(p.name)}</span><input class="goal-input" data-pid="${p.id}" value="${esc(S.goals[p.id]||'')}" placeholder="이번 주 목표"/>`;
    gl.appendChild(div);
  });
  gl.querySelectorAll('.goal-input').forEach(inp=>{
    inp.oninput=e=>{S.goals[e.target.dataset.pid]=e.target.value;dbSave();};
  });
}

function renderDayTodos(ds) {
  const tl=document.getElementById('tl_'+ds);
  if(!tl)return;
  tl.innerHTML='';
  const todos=S.weekTodos[ds]||[];
  todos.forEach((todo,i)=>{
    const div=document.createElement('div');div.className='todo-item';
    div.innerHTML=`<input type="checkbox" ${todo.d?'checked':''}/>
      <input type="text" class="todo-text${todo.d?' done':''}" value="${esc(todo.t||'')}" placeholder="할 것 입력"/>
      <button class="todo-del">×</button>`;
    tl.appendChild(div);
    div.querySelector('input[type=checkbox]').onchange=e=>{
      S.weekTodos[ds][i].d=e.target.checked;
      div.querySelector('.todo-text').classList.toggle('done',e.target.checked);
      dbSave();
    };
    div.querySelector('.todo-text').oninput=e=>{S.weekTodos[ds][i].t=e.target.value;dbSave();};
    div.querySelector('.todo-del').onclick=()=>{S.weekTodos[ds].splice(i,1);dbSave();renderDayTodos(ds);};
  });
}

function addTodo(ds) {
  if(!S.weekTodos[ds])S.weekTodos[ds]=[];
  S.weekTodos[ds].push({t:'',d:false});
  dbSave();renderDayTodos(ds);
  setTimeout(()=>{
    const tl=document.getElementById('tl_'+ds);
    if(tl){const ins=tl.querySelectorAll('.todo-text');if(ins.length)ins[ins.length-1].focus();}
  },30);
}

function changeWeek(dir) { S.selWeekMon=addDays(S.selWeekMon,dir*7);dbSave();renderWeekly(); }

// ── Mini calendar ──────────────────────────────────────────
let miniY=new Date().getFullYear(), miniM=new Date().getMonth();

function openMiniCal(e) {
  e.stopPropagation();
  miniY=new Date().getFullYear();miniM=new Date().getMonth();
  renderMiniCal();
  const btn=document.getElementById('week-range-btn');
  const rect=btn.getBoundingClientRect();
  const popup=document.getElementById('mini-popup');
  popup.style.top=(rect.bottom+6)+'px';
  popup.style.left=rect.left+'px';
  popup.classList.add('open');
  document.getElementById('mini-overlay').classList.add('open');
}
function closeMiniCal() {
  document.getElementById('mini-popup').classList.remove('open');
  document.getElementById('mini-overlay').classList.remove('open');
}
function miniMonth(d){miniM+=d;if(miniM>11){miniM=0;miniY++;}if(miniM<0){miniM=11;miniY--;}renderMiniCal();}
function renderMiniCal() {
  document.getElementById('mini-label').textContent=miniY+'년 '+MONTHS[miniM];
  const body=document.getElementById('mini-body');body.innerHTML='';
  const today=new Date();
  const firstDay=new Date(miniY,miniM,1).getDay();
  const dim=new Date(miniY,miniM+1,0).getDate();
  const dip=new Date(miniY,miniM,0).getDate();
  const selMon=S.selWeekMon, selSun=addDays(selMon,6);
  let cells=[];
  for(let i=firstDay-1;i>=0;i--)cells.push({d:dip-i,o:true});
  for(let d=1;d<=dim;d++)cells.push({d,o:false});
  while(cells.length%7!==0)cells.push({d:cells.length-firstDay-dim+1,o:true});
  for(let r=0;r<cells.length/7;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<7;c++){
      const cell=cells[r*7+c];
      const ds=miniY+'-'+pad(miniM+1)+'-'+pad(cell.d);
      const isTod=!cell.o&&cell.d===today.getDate()&&miniM===today.getMonth()&&miniY===today.getFullYear();
      const inW=!cell.o&&ds>=selMon&&ds<=selSun;
      const td=document.createElement('td');
      const btn=document.createElement('button');
      btn.className='mini-day'+(cell.o?' m-other':'')+(isTod?' m-today':'')+(inW?' m-inweek':'');
      btn.textContent=cell.d;
      if(!cell.o)btn.onclick=()=>{S.selWeekMon=getMon(new Date(ds));dbSave();renderWeekly();closeMiniCal();};
      td.appendChild(btn);tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

// ── Calendar ───────────────────────────────────────────────
let pendingDate=null;

function renderCalendar() {
  const yr=S.calYear,mo=S.calMonth;
  document.getElementById('cal-month-el').textContent=yr+'년 '+MONTHS[mo];
  const body=document.getElementById('cal-body');body.innerHTML='';
  const today=new Date();
  const firstDay=new Date(yr,mo,1).getDay();
  const dim=new Date(yr,mo+1,0).getDate();
  const dip=new Date(yr,mo,0).getDate();
  const evDates={};
  (S.events||[]).forEach(ev=>{if(ev.date)evDates[ev.date]=true;});
  let cells=[];
  for(let i=firstDay-1;i>=0;i--)cells.push({d:dip-i,o:true});
  for(let d=1;d<=dim;d++)cells.push({d,o:false});
  while(cells.length%7!==0)cells.push({d:cells.length-firstDay-dim+1,o:true});
  for(let r=0;r<cells.length/7;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<7;c++){
      const cell=cells[r*7+c];
      const ds=yr+'-'+pad(mo+1)+'-'+pad(cell.d);
      const isTod=!cell.o&&cell.d===today.getDate()&&mo===today.getMonth()&&yr===today.getFullYear();
      const hasEv=!cell.o&&evDates[ds];
      const td=document.createElement('td');
      const btn=document.createElement('button');
      btn.className='cal-day'+(cell.o?' other':'')+(isTod?' is-today':'')+(hasEv?' has-event':'');
      btn.textContent=cell.d;
      if(!cell.o)btn.onclick=()=>openEvModal(ds);
      td.appendChild(btn);tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  renderEvList();
}

function renderEvList() {
  const el=document.getElementById('ev-list');el.innerHTML='';
  const sorted=[...S.events||[]].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  sorted.forEach(ev=>{
    const p=ev.date?ev.date.split('-'):['','',''];
    const lbl=ev.date?parseInt(p[1])+'/'+parseInt(p[2]):'—';
    const div=document.createElement('div');div.className='ev-item';
    div.innerHTML=`<div class="ev-dot" style="background:${ev.color||'#378ADD'}"></div>
      <span class="ev-date">${lbl}</span>
      <span class="ev-name">${esc(ev.name)}</span>
      <button class="ev-del" onclick="delEvent(${ev.id})">×</button>`;
    el.appendChild(div);
  });
  if(!sorted.length)el.innerHTML='<div style="font-size:13px;color:var(--text3);padding:8px 0">날짜를 클릭해서 일정을 추가해줘</div>';
}

function changeMonth(dir){
  S.calMonth+=dir;
  if(S.calMonth>11){S.calMonth=0;S.calYear++;}
  if(S.calMonth<0){S.calMonth=11;S.calYear--;}
  dbSave();renderCalendar();
}

function openEvModal(ds){
  pendingDate=ds;
  const p=ds.split('-');
  document.getElementById('ev-modal-title').textContent=parseInt(p[1])+'월 '+parseInt(p[2])+'일 일정 추가';
  document.getElementById('ev-name').value='';
  document.getElementById('ev-modal').classList.add('open');
  setTimeout(()=>document.getElementById('ev-name').focus(),50);
}
function closeEvModal(){document.getElementById('ev-modal').classList.remove('open');pendingDate=null;}
function saveEvent(){
  const name=document.getElementById('ev-name').value.trim();
  if(!name)return;
  const color=document.getElementById('ev-color').value;
  S.events.push({id:S.nextId++,date:pendingDate,name,color});
  dbSave();closeEvModal();renderCalendar();renderWeekly();
}
function delEvent(id){
  S.events=S.events.filter(e=>e.id!==id);
  dbSave();renderCalendar();renderWeekly();
}

document.getElementById('ev-modal').onclick=e=>{if(e.target===document.getElementById('ev-modal'))closeEvModal();};
document.getElementById('ev-name').onkeydown=e=>{if(e.key==='Enter')saveEvent();};

// ── Settings ───────────────────────────────────────────────
function openSettings(){
  const c=S.colors||DEF.colors;
  document.getElementById('s-name').value=S.plannerName||'';
  document.getElementById('s-homelabel').value=S.homeLabel||'';
  document.getElementById('c-bg2').value=c.bg2||'#f7f7f5';
  document.getElementById('c-bg').value=c.bg||'#ffffff';
  document.getElementById('c-accent').value=c.accent||'#1a1a1a';
  document.getElementById('c-text').value=c.text||'#1a1a1a';
  renderProjEdit();renderFixedEdit();
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings(){document.getElementById('settings-overlay').classList.remove('open');}
function resetColors(){
  document.getElementById('c-bg2').value='#f7f7f5';
  document.getElementById('c-bg').value='#ffffff';
  document.getElementById('c-accent').value='#1a1a1a';
  document.getElementById('c-text').value='#1a1a1a';
}

function renderProjEdit(){
  const el=document.getElementById('proj-edit-list');el.innerHTML='';
  (S.projects||[]).forEach((p,idx)=>{
    const row=document.createElement('div');row.className='proj-row';
    row.innerHTML=`
      <div class="proj-row-top">
        <input class="proj-name-input" data-idx="${idx}" value="${esc(p.name)}" placeholder="프로젝트 이름"/>
        <select class="proj-status-sel" data-idx="${idx}">${STATUSES.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>
        <button class="proj-del" data-idx="${idx}">×</button>
      </div>
      <div class="cl-edit-area" id="cledit_${idx}"></div>
      <button class="add-cl" data-idx="${idx}">+ 체크리스트 항목 추가</button>`;
    el.appendChild(row);
    renderCLEdit(idx,p);
  });
  el.querySelectorAll('.proj-name-input').forEach(inp=>inp.oninput=e=>{S.projects[+e.target.dataset.idx].name=e.target.value;});
  el.querySelectorAll('.proj-status-sel').forEach(sel=>sel.onchange=e=>{S.projects[+e.target.dataset.idx].status=e.target.value;});
  el.querySelectorAll('.proj-del').forEach(btn=>btn.onclick=e=>{S.projects.splice(+e.target.dataset.idx,1);renderProjEdit();});
  el.querySelectorAll('.add-cl').forEach(btn=>btn.onclick=e=>{
    S.projects[+e.target.dataset.idx].checklist.push({t:'',d:false});
    renderCLEdit(+e.target.dataset.idx,S.projects[+e.target.dataset.idx]);
  });
}

function renderCLEdit(idx,p){
  const area=document.getElementById('cledit_'+idx);if(!area)return;area.innerHTML='';
  (p.checklist||[]).forEach((item,ci)=>{
    const div=document.createElement('div');div.className='cl-edit-row';
    div.innerHTML=`<input class="cl-edit-input" data-idx="${idx}" data-ci="${ci}" value="${esc(item.t)}" placeholder="항목 입력"/>
      <button class="cl-item-del" data-idx="${idx}" data-ci="${ci}">×</button>`;
    area.appendChild(div);
  });
  area.querySelectorAll('.cl-edit-input').forEach(inp=>inp.oninput=e=>{S.projects[+e.target.dataset.idx].checklist[+e.target.dataset.ci].t=e.target.value;});
  area.querySelectorAll('.cl-item-del').forEach(btn=>btn.onclick=e=>{
    S.projects[+e.target.dataset.idx].checklist.splice(+e.target.dataset.ci,1);
    renderCLEdit(+e.target.dataset.idx,S.projects[+e.target.dataset.idx]);
  });
}

function addProject(){
  S.projects.push({id:S.nextId++,name:'새 프로젝트',status:'시작 전',next:'',checklist:[]});
  renderProjEdit();
}

function renderFixedEdit(){
  const el=document.getElementById('fixed-edit-list');el.innerHTML='';
  DAYS.forEach(d=>{
    const row=document.createElement('div');row.className='fixed-row';
    row.innerHTML=`<span class="fixed-day">${d}</span><input class="fixed-input" data-day="${d}" value="${esc(S.fixed[d]||'')}" placeholder="없음"/>`;
    el.appendChild(row);
  });
  el.querySelectorAll('.fixed-input').forEach(inp=>inp.oninput=e=>{S.fixed[e.target.dataset.day]=e.target.value;});
}

function saveSettings(){
  S.plannerName=document.getElementById('s-name').value||'My Planner';
  S.homeLabel=document.getElementById('s-homelabel').value||'Projects';
  S.colors={
    bg:document.getElementById('c-bg').value,
    bg2:document.getElementById('c-bg2').value,
    accent:document.getElementById('c-accent').value,
    text:document.getElementById('c-text').value,
  };
  dbSave();applyColors();closeSettings();
  renderHome();renderWeekly();renderCalendar();
}

function switchStab(name,btn){
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.spane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('spane-'+name).classList.add('active');
}

document.getElementById('settings-overlay').onclick=e=>{if(e.target===document.getElementById('settings-overlay'))closeSettings();};

// ── Tab switch ─────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('tbtn-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}


// ── Password ───────────────────────────────────────────────
const PASSWORD = "1008"; // ← 이 부분만 바꾸면 돼

function checkPW() {
  const val = document.getElementById('pw-input').value;
  if (val === PASSWORD) {
    sessionStorage.setItem('pw_ok','1');
    document.getElementById('pw-screen').style.display = 'none';
  } else {
    document.getElementById('pw-error').textContent = '비밀번호가 틀렸어';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPW();
  document.getElementById('pw-error').textContent = '';
});

function initPW() {
  // Already unlocked this session
  if (sessionStorage.getItem('pw_ok') === '1') {
    document.getElementById('pw-screen').style.display = 'none';
  }
  // Update title on password screen
  document.getElementById('pw-title-el').textContent = S.plannerName || 'My Planner';
}

// ── Init ───────────────────────────────────────────────────
(async()=>{
  await dbLoad();
  applyColors();
  initPW();
  renderHome();
  renderWeekly();
  renderCalendar();
})();
</script>

<!-- Password screen -->
<div class="pw-screen" id="pw-screen">
  <div class="pw-box">
    <div class="pw-title" id="pw-title-el">My Planner</div>
    <div class="pw-sub">비밀번호를 입력해줘</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="••••••" />
    <button class="pw-btn" onclick="checkPW()">Enter</button>
    <div class="pw-error" id="pw-error"></div>
  </div>
</div>
</body>
</html>
